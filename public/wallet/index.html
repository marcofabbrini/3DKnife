<style>
:root{--bg:#f1f4fb;--ink:#1c2340;--mute:#6b7494;--glass:rgba(255,255,255,.62);--line:rgba(255,255,255,.9);--sh:0 20px 40px -18px rgba(54,70,140,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Exo 2',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;padding:env(safe-area-inset-top) 0 90px}
/* flow background */
.flow{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(120deg,#eef2ff,#f3f9ff,#fff1f7,#effcf6);background-size:300% 300%;animation:pan 18s ease-in-out infinite}
.flow i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.flow i:nth-child(1){width:46vmax;height:46vmax;background:#9db8ff;left:-12vmax;top:-10vmax}
.flow i:nth-child(2){width:38vmax;height:38vmax;background:#ffb3d1;right:-10vmax;top:20vh;animation-delay:-6s}
.flow i:nth-child(3){width:42vmax;height:42vmax;background:#9fead0;left:20vw;bottom:-18vmax;animation-delay:-12s}
@keyframes pan{50%{background-position:100% 100%}}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.2) rotate(40deg)}}
header{max-width:1100px;margin:0 auto;padding:28px 20px 8px}
h1{margin:0;font-weight:800;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.02em;background:linear-gradient(90deg,#3d5afe,#9b4dff,#ff4d8d,#3d5afe);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:pan2 8s linear infinite}
@keyframes pan2{to{background-position:250% 0}}
.sub{margin:4px 0 0;color:var(--mute);font-weight:300}
.chips{display:flex;gap:10px;overflow-x:auto;padding:18px 20px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);font:600 .95rem 'Exo 2';padding:10px 18px;border-radius:99px;cursor:pointer;box-shadow:0 6px 16px -10px rgba(54,70,140,.5);transition:.25s}
.chip:hover{transform:translateY(-2px)}
.chip.on{color:#fff;background:linear-gradient(135deg,#3d5afe,#9b4dff);border-color:transparent}
.chip b{font-weight:400;opacity:.65;margin-left:6px}
main{max-width:1100px;margin:0 auto;padding:10px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:30px 26px;perspective:1400px}
.slot{perspective:900px}
.card{position:relative;aspect-ratio:1.586;border-radius:22px;color:#fff;cursor:pointer;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:var(--sh);animation:enter .8s cubic-bezier(.2,.9,.2,1) backwards,bob 6s ease-in-out infinite;animation-delay:calc(var(--i)*70ms),calc(var(--i)*-700ms);overflow:hidden;isolation:isolate}
@keyframes enter{from{opacity:0;transform:translateY(60px) rotateX(50deg) scale(.9)}}
@keyframes bob{50%{translate:0 -6px}}
.card.tilt{transition:transform .08s linear;animation-play-state:running,paused;box-shadow:0 34px 50px -22px rgba(40,50,120,.55)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(10,15,40,.75))}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.55),transparent 55%);mix-blend-mode:overlay;opacity:0;transition:opacity .3s}
.card.tilt::after{opacity:1}
.card .top{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center;transform:translateZ(40px);font-weight:600;font-size:.82rem}
.tag{background:rgba(255,255,255,.28);backdrop-filter:blur(8px);padding:4px 12px;border-radius:99px}
.card .ttl{position:absolute;left:16px;right:16px;bottom:14px;transform:translateZ(50px);font-weight:800;font-size:1.25rem;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.card .ttl small{display:block;font-weight:300;font-size:.78rem;opacity:.85}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 10px}
.empty b{display:block;font-size:1.3rem;color:var(--ink);margin-bottom:6px}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:66px;height:66px;border-radius:50%;border:0;color:#fff;font-size:2rem;cursor:pointer;background:linear-gradient(135deg,#3d5afe,#9b4dff,#ff4d8d);background-size:200% 200%;animation:pan 5s ease infinite;box-shadow:0 18px 30px -10px rgba(110,70,255,.7);transition:transform .25s;z-index:5}
.fab:hover{transform:scale(1.08) rotate(90deg)}
/* modali */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(30,38,80,.35);backdrop-filter:blur(8px)}
.ov.show{display:flex}
.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border:1px solid #fff;border-radius:26px;padding:22px;box-shadow:0 40px 80px -20px rgba(30,40,100,.5);animation:pop .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:perspective(900px) rotateX(-25deg) translateY(40px) scale(.92)}}
.sheet h2{margin:0 0 14px;font-weight:800}
label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 6px;color:var(--mute)}
input[type=text]{width:100%;padding:13px 14px;border-radius:14px;border:1px solid #d9deef;font:400 1rem 'Exo 2';background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid #9b4dff55}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types .chip{padding:8px 14px;font-size:.88rem}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:13px;border-radius:14px;border:1px solid #d9deef;background:#fff;font:600 .95rem 'Exo 2';color:var(--ink);cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px -10px #3d5afe}
.btn.pri{border:0;color:#fff;background:linear-gradient(135deg,#3d5afe,#9b4dff)}
.btn.del{color:#d6224f}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.th{position:relative;width:96px;aspect-ratio:1.586;border-radius:10px;overflow:hidden;box-shadow:0 8px 16px -8px rgba(0,0,0,.5)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
video{width:100%;border-radius:18px;background:#000;max-height:60vh}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{position:relative;aspect-ratio:1.586;border-radius:14px;border:2px dashed #b9c2e6;background:#f4f6ff center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:600}
.pv.has{border:0;box-shadow:0 10px 20px -10px rgba(0,0,0,.5);color:transparent}
.pv button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
label.btn{display:flex;align-items:center;justify-content:center;margin:0;color:var(--ink);font-weight:600}
.off{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.btn.armed{background:#d6224f;color:#fff;border:0}
.sides .row{margin-top:8px}.sides .btn{padding:9px 4px;font-size:.85rem}
.flip{perspective:1600px;cursor:pointer;aspect-ratio:1.586;margin-top:4px;animation:pop .5s}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,1.25,.4,1)}
.flip.flipped .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#e9edfb,#f8f9ff);box-shadow:0 26px 40px -22px rgba(20,30,90,.7);display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:600}
.face.b{transform:rotateY(180deg)}
.face img{width:100%;height:100%;object-fit:contain}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:250% 100%;animation:shine 4s ease-in-out infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.hint{font-size:.78rem;color:var(--mute);margin-top:12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1c2340;color:#fff;padding:10px 18px;border-radius:99px;z-index:40;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html{scroll-behavior:smooth}
.flow{background:linear-gradient(120deg,#b5cbff,#dcc2ff,#ffbfd9,#b0f0d6,#b5cbff);background-size:300% 300%}
.flow i{opacity:.95;filter:blur(46px)}
.flow i:nth-child(1){background:#6a8fff}.flow i:nth-child(2){background:#ff78b0}.flow i:nth-child(3){background:#4fdba7}
.flow::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 25%,rgba(255,255,255,.55),transparent 45%)}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hbtns{display:flex;gap:10px;padding-top:8px}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib,.btn,.chip,.fab{display:flex;align-items:center;justify-content:center}
.ib{position:relative;margin:0;width:46px;height:46px;border-radius:50%;border:1px solid #fff;background:rgba(255,255,255,.85);color:var(--ink);cursor:pointer;box-shadow:0 8px 18px -10px rgba(54,70,140,.6);transition:.25s}
.ib:hover{transform:translateY(-2px) scale(1.06)}
.ib.dirty::after{content:"";position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:#ff4d8d;border:2px solid #fff}
.chips{justify-content:center;padding-top:20px}
.chip,.types .chip{width:50px;height:50px;padding:0;position:relative;border-radius:50%}
.chip b{position:absolute;top:-5px;right:-5px;margin:0;opacity:1;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#1c2340;color:#fff;font-size:.7rem;font-weight:600;display:flex;align-items:center;justify-content:center}
.btn{height:50px;padding:0;border-radius:16px}
.btn.armed{background:#d6224f;color:#fff}
.fab svg{width:30px;height:30px;stroke-width:2.2}
main{display:block;position:relative;width:min(88vw,420px);max-width:none;margin:0 auto;padding:14px 0 130px;perspective:none}
.slot{position:relative;perspective:none;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.slot+.slot{margin-top:-40%}
.card{width:100%;animation:enter .8s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i)*70ms);box-shadow:0 -10px 22px -14px rgba(20,30,90,.5),0 18px 30px -18px rgba(20,30,90,.5);transition:translate .3s cubic-bezier(.2,.8,.2,1)}
.card:hover,.card:focus-visible{translate:0 -12px}
.card::before{background:linear-gradient(180deg,rgba(10,15,40,.6),rgba(0,0,0,0) 38%,rgba(10,15,40,.55))}
.card .top{top:14px;gap:10px}
.card .top strong{font-weight:800;font-size:1.1rem;text-shadow:0 2px 8px rgba(0,0,0,.4);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .tag{display:flex;padding:6px;flex:none}.card .tag svg{width:20px;height:20px}
.card .ttl{font-weight:400;font-size:.8rem}

.sheet{--ink:#1c2340;--mute:#6b7494;color:var(--ink)}
.sheet h3{margin:20px 0 8px;font-weight:800;font-size:1rem}
.opts,.pk{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt{border:1px solid #d9deef;background:#fff;color:var(--ink);padding:9px 14px;border-radius:99px;cursor:pointer;font-size:.95rem}
.opt.on{background:var(--ink);color:#fff;border-color:transparent}
.sw3{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.5);cursor:pointer}
.sw3.on{outline:3px solid var(--ink)}
input[type=color]{width:46px;height:46px;padding:0;border:0;border-radius:14px;background:none;cursor:pointer}
.pkw{display:flex;align-items:center;gap:2px;color:var(--mute)}
input[type=range]{width:100%;accent-color:#7c5cff}
.tg{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.sw{width:50px;height:30px;border-radius:99px;border:0;background:#cfd5ea;position:relative;cursor:pointer;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.25s}
.sw.on{background:linear-gradient(135deg,#3d5afe,#9b4dff)}.sw.on::after{left:23px}
.card::before{background:linear-gradient(180deg,color-mix(in srgb,var(--a) 78%,transparent),transparent 40%,color-mix(in srgb,var(--b) 65%,transparent))}
.noan *{animation:none!important;transition:none!important}

/* tema piatto, senza sfumature */
:root{--ac1:#ff385c;--ac2:#00a699;--ac3:#fc642d;--band:37%}
svg.ic{fill:currentColor;stroke:none;width:24px;height:24px}

.sheet h2{font-weight:700;font-size:1.2rem}
.ov{background:rgba(15,23,42,.38)}
input[type=text]{border:1px solid #d1d5db;border-radius:12px;font-weight:500}
input[type=color]{border:1px solid var(--line);border-radius:12px;padding:3px;background:#fff}
.pv{border:1.5px dashed #cbd5e1;background:#f9fafb;color:#9ca3af;font-weight:500}
.pv.has{border:0;box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.face{border:0;border-radius:16px;background:#fff;box-shadow:0 20px 36px -20px rgba(15,23,42,.55)}
.toast{background:#111827;border:0;border-radius:12px;font-weight:500}
.card{border:0;color:#fff;box-shadow:0 -4px 12px -8px rgba(15,23,42,.4),0 14px 26px -16px rgba(15,23,42,.55)}
.card::before{border:0}
.card .top{color:#fff}
.card .top strong{font-weight:600;font-size:1.05rem}
.nm small{color:rgba(255,255,255,.7);font-weight:400}
.card .tag{background:rgba(255,255,255,.14);border:0;padding:7px;color:#fff;border-radius:12px}
.card .tag svg.ic{width:22px;height:22px}
.empty b{font-weight:600}
input[type=range]{accent-color:var(--ac1)}
.pkw{color:#6b7280}
/* scansione, schermata iniziale e anteprime con la foto del fronte */
video{max-height:70vh;object-fit:contain}
.camwrap{position:relative;line-height:0}
#camOv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.cropbox{position:relative;margin:0 auto;touch-action:none;line-height:0;background:#0f172a;border-radius:12px}
#cropCv{display:block;border-radius:12px}
#cropSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#cropPoly{fill:rgba(255,255,255,.12);stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;filter:drop-shadow(0 0 2px rgba(15,23,42,.85))}
.hd{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;border:3px solid #1f2937;box-shadow:0 2px 8px rgba(0,0,0,.4);touch-action:none;cursor:grab}
.card::before{display:none}
.card img{top:0;height:100%}
.card .top{top:10px;left:10px;right:10px;height:auto;align-items:flex-start}
.card .nm{background:var(--a);color:#fff;padding:7px 12px;border-radius:12px;max-width:74%}
.card .nm small{color:rgba(255,255,255,.8)}
.card .tag{background:var(--a);color:#fff;padding:8px;border-radius:12px;backdrop-filter:none}
.landing{position:fixed;inset:0;z-index:100;background:#1e293b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .55s ease,transform .55s ease}
.landing.out{opacity:0;transform:scale(1.05);pointer-events:none}
.landing .logo{width:min(68vw,290px);height:auto;margin-bottom:28px;overflow:visible}
.landing h2{margin:0;font-size:2.1rem;font-weight:700;letter-spacing:-.02em}
.landing p{margin:8px 0 0;color:#94a3b8;font-size:1rem}
.landing .enter{margin-top:40px;width:64px;height:64px;border-radius:50%;border:0;background:#fff;color:#1e293b;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);transition:transform .2s}
.landing .enter svg.ic{width:28px;height:28px}
.landing .enter:hover{transform:scale(1.07)}
.landing .tap{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));font-size:.8rem;color:#8b9ab3;animation:fade .8s 1s both}
.logo .c{animation:rise .9s cubic-bezier(.2,.9,.3,1.15) both}
.logo .c2{animation-delay:.15s}.logo .c3{animation-delay:.3s}
.landing h2,.landing p,.landing .enter{animation:fade .8s .55s both}
@keyframes rise{from{opacity:0;transform:translateY(70px)}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}

/* icone a immagine, filtro proprietario, contenuti */
img.ic{width:22px;height:22px;display:block;object-fit:contain;pointer-events:none}
.fab img.ic{width:30px;height:30px}.chip img.ic{width:28px;height:28px}.btn img.ic{width:28px;height:28px}.ib img.ic{width:26px;height:26px}
.card .tag img.ic{width:22px;height:22px}
.chips.own{padding:0 20px 6px;justify-content:safe center;gap:6px}
.chips.own:empty{display:none}
.pill{flex:none;border:1px solid var(--line);background:#fff;color:#374151;border-radius:99px;padding:6px 13px;font:500 .82rem 'Inter',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.pill b{font-weight:600;opacity:.55;margin-left:6px}
.pill.on{background:var(--ac1);border-color:var(--ac1);color:#fff}.pill.on b{opacity:.8}
.pill.none{border-style:dashed}
.info{margin-top:14px;text-align:left;font-size:.88rem}
.info .own-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.info .own-row input{flex:1;padding:10px 12px;font-size:.95rem}
.info .own-row .btn{flex:none;width:44px;height:44px}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:10px 12px;background:#f9fafb;border:1px solid var(--line);border-radius:12px}
.info dt{color:var(--mute);font-weight:500}.info dd{margin:0;font-weight:600;word-break:break-word}
.info details{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.info summary{cursor:pointer;font-weight:600;color:var(--mute)}
.info pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font:400 .8rem/1.5 'Inter',system-ui,sans-serif;color:#374151;max-height:30vh;overflow:auto}
.info .busy{display:flex;align-items:center;gap:10px;color:var(--mute)}
.info .busy::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ac1);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info .lnk{margin-top:8px;background:none;border:0;color:var(--mute);text-decoration:underline;font:500 .82rem 'Inter',system-ui,sans-serif;cursor:pointer;padding:4px 0}
.isets{display:grid;gap:8px}
.iset{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;text-align:left;color:var(--ink)}
.iset.on{outline:2px solid var(--ink);outline-offset:1px}
.iset .tx{flex:1;min-width:0}.iset .tx b{display:block;font-size:.95rem}.iset .tx small{color:var(--mute);font-size:.72rem}
.iset .prev{display:flex;gap:6px}.iset .prev .ic{width:26px;height:26px}.iset .prev img.ic{width:30px;height:30px}
.credits{font-size:.72rem;color:var(--mute);margin-top:8px;line-height:1.5}
</style>
</head>

    <g class="c c2"><rect x="116" y="156" width="280" height="180" rx="28" fill="#94a3b8"/></g>

<div class="ov" id="ovAdd"><div class="sheet">

  <label>Immagini del documento</label>

    <div><div class="pv" id="pv-back">Retro</div>
      <div class="row"><button class="btn" data-cam="back" aria-label="Scatta foto"><i data-ic="camera"></i></button><label class="btn" for="file" data-file="back" aria-label="Scegli dalla galleria"><i data-ic="image"></i></label></div></div>
  </div>
  <div class="row"><button class="btn" id="cancel" aria-label="Annulla" title="Annulla"><i data-ic="close"></i></button><button class="btn pri" id="save" aria-label="Salva" title="Salva"><i data-ic="check"></i></button></div>
</div></div>

  <div class="camwrap"><video id="vid" playsinline muted></video><canvas id="camOv"></canvas></div>

</div></div>

<!-- dettaglio -->

  <div class="flip" id="flip" tabindex="0" role="button" aria-label="Gira il documento">

/* ---- database locale (IndexedDB) ---- */
const dbp=new Promise((res,rej)=>{
  const r=indexedDB.open('wallet-documenti',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
async function store(mode){return (await dbp).transaction('docs',mode).objectStore('docs')}
const wrap=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){docs=(await wrap((await store('readonly')).getAll())).map(d=>({...d,front:d.front||(d.images&&d.images[0])||null,back:d.back||(d.images&&d.images[1])||null})).sort((a,b)=>b.date-a.date);render()}
async function put(d){await wrap((await store('readwrite')).put(d));mark(true)}

function renderChips(){
  const all=[['all','Tutti','layers'],...Object.entries(TYPES).map(([k,v])=>[k,v.n,v.e])];
  $('#chips').innerHTML=all.map(([k,n,i])=>{

    return `<button class="chip ${filter===k?'on':''}" data-k="${k}" aria-label="${n}" title="${n}">${ic(i)}<b>${c}</b></button>`}).join('');
}
const okey=d=>(d.owner||'').trim().toLowerCase();
function renderOwners(){
  const m=new Map();let none=0;
  docs.forEach(d=>{if(filter!=='all'&&d.type!==filter)return;const k=okey(d);if(!k){none++;return}const e=m.get(k)||{n:d.owner.trim(),c:0};e.c++;m.set(k,e)});

const grid=$('#grid');let raf=0;
function fx(){if(cfg.s3===false){grid.querySelectorAll('.slot').forEach(sl=>sl.style.transform='');return}
  const h=innerHeight,top=grid.getBoundingClientRect().top;
  grid.querySelectorAll('.slot').forEach(sl=>{
    const y=top+sl.offsetTop+sl.offsetHeight*.3,a=Math.max(-1.2,Math.min(1.2,(y-h*.55)/h*2));
    sl.style.transform=`perspective(1000px) translateY(${a>0?a*a*14:0}px) rotateX(${a*12}deg) scale(${1-Math.abs(a)*.05})`;
  });

    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));

  q=q.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
  let k=0,m=1e18;q.forEach((p,i)=>{const s=p[0]+p[1];if(s<m){m=s;k=i}});
  return q.slice(k).concat(q.slice(0,k));
}
function okQuad(q,w,h){
  const A=polyArea(q);if(A<.12*w*h||A>.95*w*h)return false;
  for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4];
    const v1=[a[0]-b[0],a[1]-b[1]],v2=[c[0]-b[0],c[1]-b[1]];
    const cos=(v1[0]*v2[0]+v1[1]*v2[1])/((Math.hypot(v1[0],v1[1])*Math.hypot(v2[0],v2[1]))||1);
    const ang=Math.acos(Math.max(-1,Math.min(1,cos)))*180/Math.PI;if(ang<50||ang>130)return false}

  const r1=d(q[0],q[1])/(d(q[2],q[3])||1),r2=d(q[1],q[2])/(d(q[3],q[0])||1);
  return r1>.4&&r1<2.5&&r2>.4&&r2<2.5;
}
/* trova i bordi della tessera: trasformata di Hough sulle rette, scelta del quadrilatero meglio supportato, affinamento dei lati.

function detectQuad(d,w,h){

    const a=b[i-w+1]+2*b[i+1]+b[i+w+1]-b[i-w-1]-2*b[i-1]-b[i+w-1];
    const c=b[i+w-1]+2*b[i+w]+b[i+w+1]-b[i-w-1]-2*b[i-w]-b[i-w+1];
    gx[i]=a;gy[i]=c;const m=Math.sqrt(a*a+c*c);mag[i]=m;s+=m;s2+=m*m}

  const NT=90,dth=Math.PI/NT,diag=Math.ceil(Math.hypot(w,h)),NR=2*diag+1;
  const cs=new Float32Array(NT),sn=new Float32Array(NT);
  for(let t=0;t<NT;t++){cs[t]=Math.cos(t*dth);sn[t]=Math.sin(t*dth)}
  const minV=Math.max(14,Math.round(.15*Math.min(w,h)));
  const OFF=[[1,0],[1,1],[0,1],[-1,1]];
  let best=null,bestS=0;
  for(const k of [.9,.5,1.5]){
    const thr=mean+k*sd,e=new Uint8Array(n),pts=[];
    for(let y=4;y<h-4;y++)for(let x=4;x<w-4;x++){const i=y*w+x,m=mag[i];if(m<thr)continue;
      const a=Math.atan2(gy[i],gx[i]),o=OFF[((Math.round(a/(Math.PI/4))%4)+4)%4],j=o[1]*w+o[0];
      if(m>=mag[i+j]&&m>=mag[i-j]){e[i]=1;pts.push(i)}}

    const en=new Uint8Array(n);
    for(const i of pts){en[i]=1;en[i-1]=1;en[i+1]=1;en[i-w]=1;en[i+w]=1}
    const acc=new Int32Array(NT*NR);

      const t0=Math.round(th/dth);
      for(let q=-2;q<=2;q++){const t=(t0+q+NT)%NT;acc[t*NR+Math.round(x*cs[t]+y*sn[t])+diag]++}}
    const sm=new Int32Array(NT*NR);
    for(let t=0;t<NT;t++)for(let r=1;r<NR-1;r++)sm[t*NR+r]=acc[t*NR+r-1]+acc[t*NR+r]+acc[t*NR+r+1];
    const peaks=[];
    for(let t=0;t<NT;t++)for(let r=4;r<NR-4;r++){const v=sm[t*NR+r];if(v<minV)continue;
      let ok=true;

        for(let dr=-4;dr<=4;dr++){if(!dt&&!dr)continue;const v2=sm[t2*NR+r+dr];
          if(v2>v||(v2===v&&(t2*NR+r+dr)<(t*NR+r))){ok=false;break}}}
      if(ok)peaks.push({v,t,r:r-diag})}
    peaks.sort((p,q)=>q.v-p.v);peaks.length=Math.min(peaks.length,20);
    const L=peaks.map(p=>({nx:cs[p.t],ny:sn[p.t],rho:p.r}));
    const par=[];
    for(let a=0;a<L.length;a++)for(let c=a+1;c<L.length;c++){
      const dt=L[a].nx*L[c].nx+L[a].ny*L[c].ny;if(Math.abs(dt)<.94)continue;
      const sep=Math.abs(L[a].rho-(dt>0?1:-1)*L[c].rho);if(sep>=.15*Math.min(w,h))par.push([a,c])}
    const inter=(A,B)=>{const det=A.nx*B.ny-A.ny*B.nx;if(Math.abs(det)<.3)return null;
      return[(A.rho*B.ny-B.rho*A.ny)/det,(A.nx*B.rho-B.nx*A.rho)/det]};
    const support=q=>{let tot=0,hit=0,mn=1;
      for(let i=0;i<4;i++){const A=q[i],B=q[(i+1)%4],len=Math.hypot(B[0]-A[0],B[1]-A[1]),N=Math.max(2,Math.round(len));let hh=0;
        for(let t=0;t<N;t++){const x=Math.round(A[0]+(B[0]-A[0])*t/N),y=Math.round(A[1]+(B[1]-A[1])*t/N);
          if(x>0&&y>0&&x<w-1&&y<h-1&&en[y*w+x])hh++}
        hit+=hh;tot+=N;mn=Math.min(mn,hh/N)}
      return{all:hit/tot,min:mn}};
    for(let p=0;p<par.length;p++)for(let q=p+1;q<par.length;q++){
      const[a,c]=par[p],[e1,f]=par[q];
      if(Math.abs(L[a].nx*L[e1].nx+L[a].ny*L[e1].ny)>.6)continue;
      const cn=[inter(L[a],L[e1]),inter(L[a],L[f]),inter(L[c],L[f]),inter(L[c],L[e1])];
      if(cn.some(v=>!v))continue;
      if(cn.some(v=>v[0]<.015*w||v[0]>.985*w||v[1]<.015*h||v[1]>.985*h))continue;
      const qd=orderQuad(cn);if(!okQuad(qd,w,h))continue;
      const sp=support(qd);if(sp.min<.12||sp.all<.5)continue;
      const sc=sp.all*(.35+polyArea(qd)/(w*h));
      if(sc>bestS){bestS=sc;best=qd}}

  }
  return best&&best.map(p=>[Math.min(1,Math.max(0,p[0]/w)),Math.min(1,Math.max(0,p[1]/h))]);
}
/* affina ogni lato: retta ai minimi quadrati sui pixel di bordo vicini, poi interseca i lati adiacenti */
function refineQuad(q,pts,gx,gy,w,h){
  let cur=q;
  for(let it=0;it<2;it++){
    const lines=[];
    for(let i=0;i<4;i++){
      const A=cur[i],B=cur[(i+1)%4],len=Math.hypot(B[0]-A[0],B[1]-A[1])||1,ux=(B[0]-A[0])/len,uy=(B[1]-A[1])/len,nx=uy,ny=-ux;
      let line={px:A[0],py:A[1],vx:ux,vy:uy};
      for(const tol of [6,2.5]){
        let sx=0,sy=0,c=0;const P=[];
        for(const k of pts){const x=k%w,y=(k/w)|0,dx=x-line.px,dy=y-line.py,t=(x-A[0])*ux+(y-A[1])*uy;
          if(t<.04*len||t>.96*len)continue;
          if(Math.abs(dx*(-line.vy)+dy*line.vx)>tol)continue;
          const gm=Math.hypot(gx[k],gy[k])||1;if(Math.abs(gx[k]*nx+gy[k]*ny)/gm<.85)continue;
          P.push(x,y);sx+=x;sy+=y;c++}
        if(c<.3*len)break;
        const mx=sx/c,my=sy/c;let cxx=0,cyy=0,cxy=0;
        for(let j=0;j<P.length;j+=2){const a=P[j]-mx,bb=P[j+1]-my;cxx+=a*a;cyy+=bb*bb;cxy+=a*bb}
        const ang=.5*Math.atan2(2*cxy,cxx-cyy);
        line={px:mx,py:my,vx:Math.cos(ang),vy:Math.sin(ang)};
        if(line.vx*ux+line.vy*uy<0){line.vx=-line.vx;line.vy=-line.vy}
      }
      lines.push(line);
    }
    const nq=[];
    for(let i=0;i<4;i++){
      const A=lines[(i+3)%4],B=lines[i],det=A.vx*B.vy-A.vy*B.vx;
      if(Math.abs(det)<.2)return cur;

      nq.push([A.px+A.vx*t,A.py+A.vy*t]);

}
/* omografia: rettangolo di uscita -> quadrilatero sorgente */
function homography(rect,quad){
  const A=[],B=[];
  for(let i=0;i<4;i++){const u=rect[i][0],v=rect[i][1],x=quad[i][0],y=quad[i][1];
    A.push([u,v,1,0,0,0,-u*x,-v*x]);B.push(x);
    A.push([0,0,0,u,v,1,-u*y,-v*y]);B.push(y)}

  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
    [A[i],A[p]]=[A[p],A[i]];[B[i],B[p]]=[B[p],B[i]];
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];B[r]-=f*B[i]}}

  for(let i=n-1;i>=0;i--){let s=B[i];for(let c=i+1;c<n;c++)s-=A[i][c]*X[c];X[i]=s/A[i][i]}

/* raddrizza: ritorna un canvas con la tessera frontale, in proporzione 1.586 se vicina a una carta */
function warpQuad(src,q){

  const w=(d(q[0],q[1])+d(q[3],q[2]))/2,h=(d(q[0],q[3])+d(q[1],q[2]))/2;
  let r=w/h;

  const sc=Math.min(1,1600/Math.max(w,h));

  if(H>1600){H=1600;W=Math.round(H*r)}

  const M=homography([[0,0],[W,0],[W,H],[0,H]],q);
  const sw=src.width,sh=src.height,sd=src.getContext('2d').getImageData(0,0,sw,sh).data;
  const out=document.createElement('canvas');out.width=W;out.height=H;
  const oc=out.getContext('2d'),od=oc.createImageData(W,H),o=od.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const den=M[6]*x+M[7]*y+1,sx=(M[0]*x+M[1]*y+M[2])/den,sy=(M[3]*x+M[4]*y+M[5])/den;

const rotQ=q=>orderQuad(q.map(p=>[1-p[1],p[0]]));
function rotCanvas(c){const o=document.createElement('canvas');o.width=c.height;o.height=c.width;const x=o.getContext('2d');x.translate(o.width,0);x.rotate(Math.PI/2);x.drawImage(c,0,0);return o}
function smallData(c,maxW=256){
  const k=Math.min(1,maxW/c.width),w=Math.max(8,Math.round(c.width*k)),h=Math.max(8,Math.round(c.height*k));
  const t=document.createElement('canvas');t.width=w;t.height=h;
  const x=t.getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0,w,h);return[x.getImageData(0,0,w,h).data,w,h];

function autoQuad(c){const r=smallData(c);return detectQuad(r[0],r[1],r[2])}
function defaultQuad(c){
  let w=.84,h=w*c.width/(1.586*c.height);if(h>.84){h=.84;w=h*1.586*c.height/c.width}

function canvasFromImage(im,max=2200){
  const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,k=Math.min(1,max/Math.max(iw,ih));
  const c=document.createElement('canvas');c.width=Math.round(iw*k);c.height=Math.round(ih*k);

function loadImg(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('immagine non leggibile'));im.src=url})}

/* editor di ritaglio: angoli trascinabili, rilevamento automatico, rotazione */
let crop=null;
function cropDraw(){
  const src=crop.src,cv=$('#cropCv'),box=$('#cropBox');
  if(cv.width!==src.width||cv.height!==src.height){cv.width=src.width;cv.height=src.height}
  cv.getContext('2d').drawImage(src,0,0);
  const k=Math.min(Math.min(innerWidth-70,430)/src.width,innerHeight*.5/src.height),W=Math.round(src.width*k),H=Math.round(src.height*k);
  cv.style.width=W+'px';cv.style.height=H+'px';box.style.width=W+'px';box.style.height=H+'px';
  cropUi();
}
function cropUi(){
  const q=crop.q;
  $('#cropPoly').setAttribute('points',q.map(p=>p[0]+','+p[1]).join(' '));
  document.querySelectorAll('#cropBox .hd').forEach((h,i)=>{h.style.left=q[i][0]*100+'%';h.style.top=q[i][1]*100+'%'});
}
function cropFinish(v){$('#ovCrop').classList.remove('show');const r=crop&&crop.res;crop=null;if(r)r(v)}
function cropCancel(){if(crop)cropFinish(null)}
function openCrop(src,q0){
  return new Promise(res=>{
    let q=q0||autoQuad(src);const found=!!q;if(!q)q=defaultQuad(src);
    const P=q.map(p=>[p[0]*src.width,p[1]*src.height]),dd=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
    const r=dd(P[0],P[3])/dd(P[0],P[1]);
    if(r>1.2&&r<1.9){src=rotCanvas(src);q=rotQ(q)}
    crop={src,q,res};
    $('#ovCrop').classList.add('show');cropDraw();
    if(!found&&!q0)toast('Bordi non trovati: sistema gli angoli');
  });
}
document.querySelectorAll('#cropBox .hd').forEach((h,i)=>{
  h.addEventListener('pointerdown',e=>{e.preventDefault();h.setPointerCapture(e.pointerId);h.dataset.on='1'});
  h.addEventListener('pointermove',e=>{
    if(!h.dataset.on||!crop)return;
    const r=$('#cropBox').getBoundingClientRect();
    crop.q[i]=[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];cropUi()});
  const up=()=>{delete h.dataset.on};h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});
$('#cropRot').onclick=()=>{if(!crop)return;crop.src=rotCanvas(crop.src);crop.q=rotQ(crop.q);cropDraw()};
$('#cropAuto').onclick=()=>{if(!crop)return;const q=autoQuad(crop.src);if(q){crop.q=q;cropUi()}else toast('Bordi non trovati')};
$('#cropFull').onclick=()=>{if(!crop)return;crop.q=[[.001,.001],[.999,.001],[.999,.999],[.001,.999]];cropUi()};
$('#cropNo').onclick=cropCancel;
$('#cropOk').onclick=()=>{
  if(!crop)return;
  const s=crop.src,out=warpQuad(s,crop.q.map(p=>[p[0]*s.width,p[1]*s.height]));
  cropFinish(out.toDataURL('image/jpeg',.9));
};
async function addFiles(files){
  const f=files[0];if(!f)return;
  const url=URL.createObjectURL(f);let im;
  try{im=await loadImg(url)}catch(e){URL.revokeObjectURL(url);return toast('Immagine non leggibile: prova con un JPG o PNG')}

/* fotocamera: anteprima live con rilevamento della tessera, ripiego sulla fotocamera di sistema */
let camT=0,camQ=null,camQt=0;
function camMap(){
  const v=$('#vid'),cw=v.clientWidth,ch=v.clientHeight,vw=v.videoWidth,vh=v.videoHeight,s=Math.min(cw/vw,ch/vh);
  return{cw,ch,s,ox:(cw-vw*s)/2,oy:(ch-vh*s)/2,vw,vh};
}
function camLoop(){
  if(!stream)return;
  const v=$('#vid');
  if(v.videoWidth&&v.readyState>=2){
    const w=224,h=Math.max(8,Math.round(v.videoHeight*w/v.videoWidth));
    const t=camLoop.t||(camLoop.t=document.createElement('canvas'));t.width=w;t.height=h;
    const x=t.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);
    const q=detectQuad(x.getImageData(0,0,w,h).data,w,h),now=performance.now();
    if(q){camQ=q;camQt=now}else if(now-camQt>700)camQ=null;
    const o=$('#camOv'),m=camMap();o.width=m.cw;o.height=m.ch;
    const g=o.getContext('2d');g.clearRect(0,0,m.cw,m.ch);g.lineJoin='round';
    const P=p=>[m.ox+p[0]*m.vw*m.s,m.oy+p[1]*m.vh*m.s];
    if(camQ){
      const pts=camQ.map(P);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
      g.fillStyle='rgba(255,255,255,.14)';g.fill();
      g.lineWidth=5;g.strokeStyle='rgba(15,23,42,.55)';g.stroke();g.lineWidth=2.5;g.strokeStyle='#fff';g.stroke();
      pts.forEach(p=>{g.beginPath();g.arc(p[0],p[1],6,0,7);g.fillStyle='#fff';g.fill()});
    }else{
      const w2=m.vw*m.s*.82,h2=w2/1.586,x2=m.ox+(m.vw*m.s-w2)/2,y2=m.oy+(m.vh*m.s-h2)/2;
      g.setLineDash([10,8]);g.lineWidth=2.5;g.strokeStyle='rgba(255,255,255,.85)';g.strokeRect(x2,y2,w2,h2);g.setLineDash([]);
    }
  }
  camT=setTimeout(camLoop,220);
}
async function openCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return $('#fileCam').click();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
    $('#vid').srcObject=stream;await $('#vid').play();$('#ovCam').classList.add('show');camQ=null;camLoop();
  }catch(err){$('#fileCam').click()}
}
function stopCam(){clearTimeout(camT);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#ovCam').classList.remove('show')}
$('#camClose').onclick=stopCam;
$('#shot').onclick=async()=>{
  const v=$('#vid');if(!v.videoWidth)return;
  const k=Math.min(1,2200/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');

  S('Colori',`<div class="opts">${PRESETS.map((p,i)=>`<button class="sw3 ${c.ac.join()===p.join()?'on':''}" data-pre="${i}" aria-label="Tavolozza ${i+1}" style="background:linear-gradient(90deg,${p[0]} 33.3%,${p[1]} 33.3% 66.6%,${p[2]} 66.6%)"></button>`).join('')}</div>
   <label>Colori principali</label><div class="pk">${c.ac.map((v,i)=>`<input type="color" value="${v}" data-ac="${i}" aria-label="Colore ${i+1}">`).join('')}</div>
   <label>Colore delle schede</label><div class="pk">${Object.entries(TYPES).map(([k,v])=>`<span class="pkw">${ic(v.e)}<input type="color" value="${v.a}" data-tc="${k}" aria-label="${v.n}"></span>`).join('')}</div>`)+
  S('Stile',`<div class="opts">${[['sfumato','Colore'],['vetro','Chiaro'],['piatto','Nero']].map(([k,n])=>B(c.cs===k,`data-cs="${k}"`,n)).join('')}</div>
   <label>Arrotondamento</label><input type="range" min="6" max="36" value="${c.rad}" data-r="rad">
   <label>Sovrapposizione delle schede</label><input type="range" min="20" max="58" value="${c.ov}" data-r="ov">
   <div class="tg"><span>Effetto 3D allo scorrimento</span><button class="sw ${c.s3?'on':''}" data-t="s3" aria-label="Effetto 3D"></button></div>
   <div class="tg"><span>Schermata iniziale</span><button class="sw ${c.ld?'on':''}" data-t="ld" aria-label="Schermata iniziale"></button></div>
   <div class="tg"><span>Animazioni</span><button class="sw ${c.an?'on':''}" data-t="an" aria-label="Animazioni"></button></div>
   <div class="tg"><span>Schermo intero all'avvio</span><button class="sw ${c.fs?'on':''}" data-t="fs" aria-label="Schermo intero"></button></div>`)+
  S('Sfondo',`<div class="opts">${[['solid','Tinta unita'],['image','Immagine']].map(([k,n])=>B(c.bg===k,`data-bg="${k}"`,n)).join('')}</div>
   <label>Colori dello sfondo</label><div class="pk"><input type="color" value="${c.b1}" data-b="b1" aria-label="Sfondo 1">
   <label class="ib" for="bgimg" aria-label="Scegli immagine" title="Scegli immagine">${ic('image')}</label><button class="ib" data-clrimg aria-label="Rimuovi immagine" title="Rimuovi immagine">${ic('trash')}</button></div>`);
}
const sb=$('#setBody');
sb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.iset){setIset(d.iset);return}if(d.ocrall){$('#ovSet').classList.remove('show');ocrPending();return}
  if(d.font)cfg.font=d.font;else if(d.pre)cfg.ac=[...PRESETS[+d.pre]];else if(d.cs)cfg.cs=d.cs;else if(d.t)cfg[d.t]=!cfg[d.t];else if(d.bg)cfg.bg=d.bg;else if('clrimg' in d)cfg.img=null;else return;
  commit();ui()});
sb.addEventListener('input',e=>{const t=e.target,d=t.dataset;
  if(d.ac!==undefined)cfg.ac[+d.ac]=t.value;else if(d.tc)cfg.tc[d.tc]=t.value;else if(d.r)cfg[d.r]=+t.value;else if(d.b)cfg[d.b]=t.value;else return;commit()});
$('#bgimg').addEventListener('change',async e=>{
  const f=e.target.files[0];if(f){const u=URL.createObjectURL(f),sm=await shrink(u,1400);URL.revokeObjectURL(u);
    if(sm){cfg.img=sm;cfg.bg='image';commit();ui()}else toast('Immagine non leggibile')}
  e.target.value=''});
$('#setBtn').onclick=()=>{Object.keys(FONTS).forEach(loadFont);ui();ISETS.forEach(([k])=>{if(k!==ISET)loadSet(k).then(()=>{if($('#ovSet').classList.contains('show'))ui()}).catch(()=>{})});$('#ovSet').classList.add('show')};
$('#setOk').onclick=()=>$('#ovSet').classList.remove('show');
$('#setReset').onclick=()=>{cfg=structuredClone(DEF);ISET='reg';commit();refreshIcons();ui()};
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
applySettings();
function fs(){const d=document,e=d.documentElement;
  if(d.fullscreenElement){d.exitFullscreen();return}
  const f=e.requestFullscreen||e.webkitRequestFullscreen;
  if(f){const r=f.call(e,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}}
$('#fsBtn').onclick=fs;
document.addEventListener('fullscreenchange',()=>{$('#fsBtn').innerHTML=ic(document.fullscreenElement?'compress':'expand')});
let fsTried=false;
addEventListener('pointerup',e=>{if(fsTried||!cfg.fs)return;fsTried=true;if(!e.target.closest('#fsBtn')&&!document.fullscreenElement)fs()});

/* schermata iniziale */
(function(){
  const L=$('#landing');if(!L)return;
  if(cfg.ld===false){L.remove();return}
  let t=0;
  const go=()=>{if(L.classList.contains('out'))return;clearTimeout(t);L.classList.add('out');setTimeout(()=>L.remove(),650)};
  $('#enter').onclick=go;L.addEventListener('pointerup',go);t=setTimeout(go,3600);
})();

load().catch(()=>{
  const m=document.createElement('p');m.className='empty';
  m.innerHTML='<b>Archivio non disponibile</b>Il browser blocca la memoria locale per questa pagina. Aprila da Chrome con l\'indirizzo del file (file:///...) o da un indirizzo https.';
  $('#grid').replaceChildren(m);
});
</script>
</body>
</html>
